<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 文的项目工作台</title>
    <script>
        (function () {
            var key = 'wt_theme';
            var t = localStorage.getItem(key);
            if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                t = 'dark';
            }
            if (t === 'dark' || t === 'light') {
                document.documentElement.setAttribute('data-theme', t);
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/fonts/phosphor-regular.css">
    <link rel="stylesheet" href="assets/fonts/inter.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

<button type="button" id="theme-toggle" class="login-theme-toggle" aria-label="切换外观">
    <i class="ph ph-sun" id="theme-toggle-icon" aria-hidden="true"></i>
</button>

<div class="login-shell">
    <header class="login-brand">
        <div class="login-logo">
            <img src="assets/gif/logo.gif" alt="">
        </div>
        <h1>文的项目工作台</h1>
        <p>登录以继续</p>
    </header>

    <form id="login-form" class="login-card" novalidate>
        <div class="login-field">
            <label for="username">用户名</label>
            <div class="login-input-wrap">
                <input type="text" id="username" autocomplete="username" autofocus
                       placeholder="admin">
            </div>
        </div>
        <div class="login-field">
            <label for="password">密码</label>
            <div class="login-input-wrap">
                <input type="password" id="password" autocomplete="current-password"
                       placeholder="密码">
                <button type="button" id="toggle-pwd" class="login-pwd-toggle" aria-label="显示密码">
                    <i class="ph ph-eye"></i>
                </button>
            </div>
        </div>

        <label class="login-remember">
            <input type="checkbox" id="remember">
            <span>30 天内免登录</span>
        </label>

        <p id="error-box" class="login-error hidden" role="alert"></p>

        <button type="submit" id="submit-btn" class="login-submit">登录</button>

        <button type="button" id="trial-btn" class="login-trial" style="display:none">
            试用账号登录
        </button>
    </form>

    <p class="login-foot">
        忘记账号可删除 <code>backend/data/auth.json</code> 后重启，
        或设置 <code>APP_USERNAME</code> / <code>APP_PASSWORD</code>。
    </p>
</div>

<script>
(function () {
    'use strict';

    var THEME_KEY = 'wt_theme';
    var form = document.getElementById('login-form');
    var userInput = document.getElementById('username');
    var pwdInput = document.getElementById('password');
    var rememberInput = document.getElementById('remember');
    var errorBox = document.getElementById('error-box');
    var submitBtn = document.getElementById('submit-btn');
    var toggleBtn = document.getElementById('toggle-pwd');
    var trialBtn = document.getElementById('trial-btn');
    var themeToggle = document.getElementById('theme-toggle');
    var themeIcon = document.getElementById('theme-toggle-icon');
    var trialUsername = 'trial';

    function getTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    function syncThemeUi() {
        var dark = getTheme() === 'dark';
        themeIcon.className = 'ph ' + (dark ? 'ph-moon' : 'ph-sun');
        themeToggle.setAttribute('aria-label', dark ? '切换到亮色外观' : '切换到暗色外观');
    }

    function setTheme(mode) {
        document.documentElement.setAttribute('data-theme', mode);
        try {
            localStorage.setItem(THEME_KEY, mode);
        } catch (e) { /* ignore */ }
        syncThemeUi();
    }

    if (!document.documentElement.getAttribute('data-theme')) {
        setTheme('light');
    } else {
        syncThemeUi();
    }

    themeToggle.addEventListener('click', function () {
        setTheme(getTheme() === 'dark' ? 'light' : 'dark');
    });

    function safeNext() {
        var raw = new URLSearchParams(location.search).get('next') || '/';
        if (raw.charAt(0) !== '/' || raw.charAt(1) === '/' || raw.indexOf('\\') !== -1) return '/';
        return raw;
    }

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
    }

    function clearError() {
        errorBox.classList.add('hidden');
    }

    toggleBtn.addEventListener('click', function () {
        var isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        toggleBtn.innerHTML = '<i class="ph ' + (isPwd ? 'ph-eye-slash' : 'ph-eye') + '"></i>';
        toggleBtn.setAttribute('aria-label', isPwd ? '隐藏密码' : '显示密码');
        pwdInput.focus();
    });

    pwdInput.addEventListener('input', clearError);
    userInput.addEventListener('input', clearError);

    function doLogin(body, btn) {
        var activeBtn = btn || submitBtn;
        activeBtn.disabled = true;
        var prevText = activeBtn.textContent;
        activeBtn.textContent = '登录中…';

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(body)
        })
            .then(function (res) { return res.json(); })
            .then(function (result) {
                if (result.success) {
                    location.replace(safeNext());
                } else {
                    showError(result.error || '登录失败');
                    activeBtn.disabled = false;
                    activeBtn.textContent = prevText;
                    if (body.password) pwdInput.select();
                }
            })
            .catch(function (err) {
                console.error(err);
                showError('网络异常，请稍后重试');
                activeBtn.disabled = false;
                activeBtn.textContent = prevText;
            });
    }

    trialBtn.addEventListener('click', function () {
        clearError();
        userInput.value = trialUsername;
        doLogin({ username: trialUsername, remember: false }, trialBtn);
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();

        var username = userInput.value.trim();
        var password = pwdInput.value;
        if (!username) {
            showError('请输入用户名');
            userInput.focus();
            return;
        }
        if (!password) {
            showError('请输入密码');
            pwdInput.focus();
            return;
        }

        doLogin({
            username: username,
            password: password,
            remember: rememberInput.checked
        }, submitBtn);
    });

    fetch('/api/auth/status')
        .then(function (r) { return r.json(); })
        .then(function (result) {
            if (result.success && result.data.authenticated) {
                location.replace(safeNext());
            }
            if (result.success && result.data.usernameHint && !userInput.value) {
                userInput.value = result.data.usernameHint;
            }
            if (result.success && result.data.trialLoginAvailable) {
                trialUsername = result.data.trialUsername || 'trial';
                trialBtn.style.display = 'block';
            }
        })
        .catch(function () {});
})();
</script>
</body>
</html>
