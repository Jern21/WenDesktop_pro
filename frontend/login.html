<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 文的项目工作台</title>
    <script src="assets/tailwind.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/phosphor-regular.css">
    <link rel="stylesheet" href="assets/fonts/inter.css">
</head>
<body class="min-h-screen bg-[#f9fafb] flex items-center justify-center p-4 font-sans">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <div class="w-14 h-14 mx-auto rounded-2xl overflow-hidden bg-white border border-gray-100 shadow-sm flex-shrink-0">
            <img src="assets/gif/logo.gif" alt="文的项目工作台" class="w-full h-full object-cover">
        </div>
        <h1 class="mt-4 text-lg font-medium text-gray-800">文的项目工作台</h1>
        <p class="mt-1 text-sm text-gray-400">请输入用户名和密码</p>
    </div>

    <form id="login-form" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
        <div class="mb-4">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
            <input type="text" id="username" autocomplete="username" autofocus
                   class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-blue-500 transition-colors"
                   placeholder="默认 admin">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
            <div class="relative">
                <input type="password" id="password" autocomplete="current-password"
                       class="w-full border border-gray-200 rounded-lg px-3 py-2.5 pr-10 text-sm outline-none focus:border-blue-500 transition-colors"
                       placeholder="请输入密码">
                <button type="button" id="toggle-pwd"
                        class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-gray-400 hover:text-gray-600">
                    <i class="ph ph-eye text-base"></i>
                </button>
            </div>
        </div>

        <label class="mt-4 flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 text-blue-500 focus:ring-blue-500">
            <span class="text-sm text-gray-600">30 天内免登录</span>
        </label>

        <p id="error-box" class="mt-3 text-sm text-red-500 hidden"></p>

        <button type="submit" id="submit-btn"
                class="mt-5 w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
            登录
        </button>

        <button type="button" id="trial-btn" style="display:none"
                class="mt-3 w-full py-2.5 border border-gray-200 text-gray-700 bg-white hover:bg-gray-50 rounded-lg text-sm font-medium transition-colors">
            试用账号登录（免密）
        </button>
    </form>

    <p class="mt-5 text-center text-xs text-gray-400 leading-relaxed">
        忘记账号？删除 <code class="px-1 bg-gray-100 rounded">backend/data/auth.json</code> 后重启可重新生成，
        <br>或设置 <code class="px-1 bg-gray-100 rounded">APP_USERNAME</code> / <code class="px-1 bg-gray-100 rounded">APP_PASSWORD</code>。
    </p>
</div>

<script>
(function () {
    'use strict';

    var form = document.getElementById('login-form');
    var userInput = document.getElementById('username');
    var pwdInput = document.getElementById('password');
    var rememberInput = document.getElementById('remember');
    var errorBox = document.getElementById('error-box');
    var submitBtn = document.getElementById('submit-btn');
    var toggleBtn = document.getElementById('toggle-pwd');
    var trialBtn = document.getElementById('trial-btn');
    var trialUsername = 'trial';

    /**
     * 只接受站内相对路径，防止 ?next=//evil.com 这类开放重定向
     */
    function safeNext() {
        var raw = new URLSearchParams(location.search).get('next') || '/';
        if (raw.charAt(0) !== '/' || raw.charAt(1) === '/' || raw.indexOf('\\') !== -1) return '/';
        return raw;
    }

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
    }

    function clearError() {
        errorBox.classList.add('hidden');
    }

    toggleBtn.addEventListener('click', function () {
        var isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        toggleBtn.innerHTML = '<i class="ph ' + (isPwd ? 'ph-eye-slash' : 'ph-eye') + ' text-base"></i>';
        pwdInput.focus();
    });

    pwdInput.addEventListener('input', clearError);

    function doLogin(body, btn) {
        var activeBtn = btn || submitBtn;
        activeBtn.disabled = true;
        var prevText = activeBtn.textContent;
        activeBtn.textContent = '登录中...';

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(body)
        })
            .then(function (res) { return res.json(); })
            .then(function (result) {
                if (result.success) {
                    location.replace(safeNext());
                } else {
                    showError(result.error || '登录失败');
                    activeBtn.disabled = false;
                    activeBtn.textContent = prevText;
                    if (body.password) pwdInput.select();
                }
            })
            .catch(function (err) {
                console.error(err);
                showError('网络异常，请稍后重试');
                activeBtn.disabled = false;
                activeBtn.textContent = prevText;
            });
    }

    trialBtn.addEventListener('click', function () {
        clearError();
        userInput.value = trialUsername;
        doLogin({ username: trialUsername, remember: false }, trialBtn);
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();

        var username = userInput.value.trim();
        var password = pwdInput.value;
        if (!username) {
            showError('请输入用户名');
            userInput.focus();
            return;
        }
        if (!password) {
            showError('请输入密码');
            return;
        }

        doLogin({
            username: username,
            password: password,
            remember: rememberInput.checked
        }, submitBtn);
    });

    // 已在登录状态则直接跳转
    fetch('/api/auth/status')
        .then(function (r) { return r.json(); })
        .then(function (result) {
            if (result.success && result.data.authenticated) {
                location.replace(safeNext());
            }
            if (result.success && result.data.usernameHint && !userInput.value) {
                userInput.value = result.data.usernameHint;
            }
            if (result.success && result.data.trialLoginAvailable) {
                trialUsername = result.data.trialUsername || 'trial';
                trialBtn.style.display = 'block';
            }
        })
        .catch(function () {});
})();
</script>
</body>
</html>
