        <div id="infinite-canvas-page" class="relative flex-1 overflow-hidden bg-[#fafafa] select-none">
            <style>
                #infinite-canvas-page .minimal-dot-pattern {
                    background-color: #fafafa;
                    background-image: radial-gradient(#e4e4e7 1.15px, transparent 1.15px);
                    background-size: 24px 24px;
                }
                #infinite-canvas-page .canvas-transition {
                    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
                }
                #infinite-canvas-page .node-dragging {
                    cursor: grabbing;
                }
                #infinite-canvas-page .ic-terminal-shell:focus-within {
                    border-color: rgba(99,102,241,0.38);
                    box-shadow: 0 22px 60px -28px rgba(99,102,241,0.65), 0 0 26px rgba(56,189,248,0.16), 0 0 0 1px rgba(99,102,241,0.18);
                }
                @keyframes ic-dash {
                    to { stroke-dashoffset: -20; }
                }
                #infinite-canvas-page .animate-dash {
                    stroke-dasharray: 6;
                    animation: ic-dash 1.2s linear infinite;
                }
                [data-theme="aurora"] #infinite-canvas-page .minimal-dot-pattern {
                    background-color: #0f0e17;
                    background-image: radial-gradient(rgba(167,139,250,0.28) 1.15px, transparent 1.15px);
                }
                [data-theme="glow-digital-dark"] #infinite-canvas-page .minimal-dot-pattern {
                    background-color: #0b0f19;
                    background-image: radial-gradient(rgba(129,140,248,0.3) 1.15px, transparent 1.15px);
                }
            </style>

            <div id="canvas-viewport" class="minimal-dot-pattern absolute inset-0 overflow-hidden cursor-grab active:cursor-grabbing">
                <div class="absolute top-6 right-6 bg-white/85 border border-zinc-200/60 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-mono text-zinc-500 shadow-sm pointer-events-none z-20 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    ZOOM: <span id="hud-zoom" class="text-zinc-800 font-semibold">100%</span>
                </div>

                <div id="canvas-board" class="absolute inset-0 canvas-transition origin-center flex items-center justify-center pointer-events-none">
                    <div id="canvas-origin" class="relative w-0 h-0 overflow-visible pointer-events-auto">
                        <svg id="connections-svg" class="absolute pointer-events-none" style="width: 20000px; height: 20000px; left: -10000px; top: -10000px; overflow: visible;"></svg>
                        <div id="cards-container" class="absolute inset-0 pointer-events-none"></div>
                        <div id="empty-target" class="absolute -translate-x-1/2 -translate-y-1/2 text-center space-y-2 pointer-events-auto select-none transition-all duration-300">
                            <div class="w-12 h-12 rounded-2xl bg-white border border-zinc-200/70 shadow-sm flex items-center justify-center mx-auto text-zinc-400">
                                <i class="ph ph-wind text-xl"></i>
                            </div>
                            <div class="space-y-0.5">
                                <p class="text-[11px] text-zinc-400 tracking-wide font-medium">IMAGE CANVAS STUDIO</p>
                                <p class="text-[10px] text-zinc-400/80">在下方输入指令开始绘制创意节点</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="absolute bottom-6 right-6 bg-white border border-zinc-200/70 p-1 rounded-xl flex items-center gap-0.5 shadow-md pointer-events-auto z-20">
                    <button id="btn-zoom-in" class="w-7 h-7 rounded-lg text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 transition-colors flex items-center justify-center text-xs" title="放大">
                        <i class="ph ph-plus"></i>
                    </button>
                    <button id="btn-zoom-out" class="w-7 h-7 rounded-lg text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 transition-colors flex items-center justify-center text-xs" title="缩小">
                        <i class="ph ph-minus"></i>
                    </button>
                    <button id="btn-zoom-reset" class="w-7 h-7 rounded-lg text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 transition-colors flex items-center justify-center text-xs" title="重置视角">
                        <i class="ph ph-arrows-out-simple"></i>
                    </button>
                </div>
            </div>

            <div id="float-terminal" class="ic-terminal-shell absolute bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-xl bg-white/90 border border-zinc-200/80 backdrop-blur-lg rounded-2xl px-3.5 py-3 shadow-xl z-30 transition-all duration-300 focus-within:border-indigo-300">
                <div id="terminal-reference-info" class="hidden flex items-center justify-between bg-violet-50/70 text-violet-700 px-2.5 py-1.5 rounded-xl text-[10px] mb-2 border border-violet-100/60">
                    <span class="flex items-center gap-1.5 font-medium">
                        <i class="ph ph-git-branch text-violet-500"></i>
                        正在修改/衍生节点 <strong id="ref-node-display-id" class="font-mono">#----</strong> 的图像...
                    </span>
                    <button id="btn-clear-reference" type="button" class="text-violet-400 hover:text-violet-600 transition-colors">
                        <i class="ph-fill ph-x-circle text-xs"></i>
                    </button>
                </div>

                <div id="api-status-badge" class="hidden items-center justify-between bg-amber-50 text-amber-700 px-2.5 py-1.5 rounded-xl text-[10px] mb-2 border border-amber-100/60">
                    <span class="flex items-center gap-1.5 font-medium">
                        <i class="ph ph-warning-circle text-amber-500"></i>
                        AI生图API未配置，当前生成为预览占位图
                    </span>
                    <button type="button" data-path="/settings" class="text-amber-600 hover:text-amber-800 underline font-medium transition-colors">去配置</button>
                </div>

                <div class="flex items-center gap-3">
                    <textarea id="prompt-input" rows="1" placeholder="输入创意指令，或点击卡片上的「衍生」在其基础上调整..." class="flex-1 bg-transparent text-zinc-800 placeholder-zinc-400 focus:outline-none text-xs leading-relaxed resize-none h-5 font-sans py-0.5"></textarea>
                    <button id="btn-generate" type="button" class="h-8 px-4 bg-zinc-900 hover:bg-zinc-800 text-white transition-all duration-200 font-medium text-xs rounded-xl shadow-sm flex items-center gap-1">
                        <span>生成</span>
                        <i class="ph ph-arrow-right text-[11px]"></i>
                    </button>
                </div>

                <div class="flex items-center justify-between gap-3 pt-2.5 mt-2 border-t border-zinc-100">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="flex items-center gap-1" id="aspect-ratio-selector">
                            <button type="button" data-ratio="1:1" class="ratio-btn px-2 py-0.5 rounded-md text-[10px] bg-zinc-100 text-zinc-700 hover:bg-zinc-200 transition-colors">1:1</button>
                            <button type="button" data-ratio="16:9" class="ratio-btn px-2 py-0.5 rounded-md text-[10px] bg-transparent text-zinc-400 hover:text-zinc-600 transition-colors">16:9</button>
                            <button type="button" data-ratio="9:16" class="ratio-btn px-2 py-0.5 rounded-md text-[10px] bg-transparent text-zinc-400 hover:text-zinc-600 transition-colors">9:16</button>
                            <button type="button" data-ratio="4:3" class="ratio-btn px-2 py-0.5 rounded-md text-[10px] bg-transparent text-zinc-400 hover:text-zinc-600 transition-colors">4:3</button>
                        </div>
                        <span class="h-3 w-px bg-zinc-200"></span>
                        <select id="preset-style-select" class="bg-transparent border-0 text-[10px] font-medium text-zinc-400 hover:text-zinc-600 cursor-pointer focus:outline-none transition-colors">
                            <option value="">原始设计</option>
                            <option value="真实摄影，柔和布光，景深">真实摄影</option>
                            <option value="精致 3D 渲染，柔和建模，干净材质">精致3D</option>
                            <option value="细腻水彩，轻盈笔触，艺术纹理">艺术水彩</option>
                            <option value="极简线稿插画，干净矢量风">极简插画</option>
                            <option value="明亮动漫风，高饱和色彩，温暖氛围">明亮动漫</option>
                        </select>
                    </div>

                    <button id="btn-reset-session" type="button" class="text-zinc-400 hover:text-red-500 text-[10px] transition-colors flex items-center gap-1 py-0.5 px-1.5 rounded-md hover:bg-zinc-50 shrink-0" title="清空并重置画纸">
                        <i class="ph ph-trash text-[11px]"></i> 重置画布
                    </button>
                </div>
            </div>

            <div id="toast-container" class="fixed top-6 right-6 z-50 space-y-2 pointer-events-none"></div>
        </div>
